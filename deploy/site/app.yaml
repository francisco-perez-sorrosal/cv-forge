# Wasmer Edge static-site manifest for `fps-cv` -- the published HTML CV.
#
# `public/` is generated by `cv-forge`'s `publish.yml` workflow and
# is gitignored here (see `deploy/site/README.md`); this manifest ships
# with no committed site content, only the app definition.
#
# No live Wasmer app exists yet (the first deploy creates it) and Wasmer Edge has no
# local emulator, so this manifest is a best-effort scaffold following the
# documented `wasmer deploy --template=static-website` shape
# (RESEARCH_FINDINGS_deploy-mcp-wasmer.md § Q4) rather than a
# tool-generated file -- reconcile against whatever `wasmer app create
# fps-cv --template=static-website` actually scaffolds on the first deploy, the first
# point this can be checked against the real platform.
kind: wasmer.io/App.v0
name: fps-cv
owner: francisco-perez-sorrosal
package: .
