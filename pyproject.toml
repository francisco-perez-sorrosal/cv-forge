[project]
name = "cv-forge"
version = "0.0.5"
description = "MCP server with structured YAML data layer, semantic overlay, and query tools for Francisco Perez-Sorrosal's CV"
license = {text = "MIT"}
authors = [
    {name = "Francisco Perez Sorrosal", email = "fperezsorrosal@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License", # Or your preferred license
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.9.2,<2",
    "loguru>=0.7.3,<0.8",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1,<4",
]

[project.urls]
"Homepage" = "https://github.com/francisco-perez-sorrosal/cv"
"Bug Tracker" = "https://github.com/francisco-perez-sorrosal/cv/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
cv_forge = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
build = ">=1.3.0,<2"
pip = ">=25.2,<26"
uv = "*"
pytest = ">=8.0,<9"

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
mcps="python src/cv_forge/mcp/main.py"
start="python src/cv_forge/mcp/main.py"
test = "pytest tests/ -v"
test-unit = "pytest tests/ -v -m 'not integration'"
test-integration = "pytest tests/ -v -m integration"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cv_forge"]

[project.scripts]
cv-mcp-server = "cv_forge.mcp.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that load real YAML data files"]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is owned by the formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warnings_as_errors = true
strict = true
# For FastAPI and Pydantic, if needed:
# plugins = "pydantic.mypy"

[[tool.mypy.overrides]]
module = [
    "aiofiles",
    "multipart"
]
ignore_missing_imports = true

