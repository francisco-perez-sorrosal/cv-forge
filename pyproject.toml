[project]
name = "cv-forge"
version = "1.0.7"
description = "MCP server with structured YAML data layer, semantic overlay, and query tools for Francisco Perez-Sorrosal's CV"
license = {text = "MIT"}
authors = [
    {name = "Francisco Perez Sorrosal", email = "fperezsorrosal@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License", # Or your preferred license
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.2,<3",
    "loguru>=0.7.3,<0.8",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1,<4",
    # WASIX ceilings, verified 2026-09-13 against python-registry.wasix.org
    # (the Wasmer Edge deploy cross-installs wheels from that index only):
    #   pydantic-core 2.46.4  -> pydantic 2.13.5+ needs a newer core; keep <2.13.5
    #   cryptography  50.0.0  -> arrives via mcp -> pyjwt[crypto]; imported at
    #                            module load by mcp.server.request_state
    #   cffi          2.1.0   -> via cryptography
    # scripts/check_wasix_ceilings.py (CI + deploy preflight) re-checks these.
    # HTTP client: mcp 2.x brings httpx2 (pydantic's fork); the release fetcher
    # uses it rather than adding a second HTTP stack to the Edge image.
    "pydantic>=2.12,<2.13.5",
    "cryptography>=43,<50.0.1",
    "cffi>=2.1,<2.1.1",
    # CA bundle for the release fetcher: httpx2 verifies via the OS trust
    # store (truststore), which the WASIX image does not have.
    "certifi>=2025.1",
    # The release fetcher's HTTP client (pydantic's httpx fork, also what
    # mcp 2.x uses) -- declared because production code imports it directly.
    "httpx2>=2.5,<3",
]

[project.urls]
"Homepage" = "https://github.com/francisco-perez-sorrosal/cv"
"Bug Tracker" = "https://github.com/francisco-perez-sorrosal/cv/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
# Wasmer Edge / WASIX wheels target cp313; keep every platform on the same ABI.
python = "3.13.*"

[tool.pixi.pypi-dependencies]
cv_forge = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
build = ">=1.3.0,<2"
pip = ">=25.2,<26"
uv = "*"
pytest = ">=8.0,<9"

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
mcps="cv-forge serve"
start="cv-forge serve"
cv-forge="cv-forge"
test = "pytest tests/ -v"
test-unit = "pytest tests/ -v -m 'not integration'"
test-integration = "pytest tests/ -v -m integration"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cv_forge"]

[project.scripts]
cv-forge = "cv_forge.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that load real YAML data files"]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is owned by the formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warnings_as_errors = true
strict = true
# For FastAPI and Pydantic, if needed:
# plugins = "pydantic.mypy"

[[tool.mypy.overrides]]
module = [
    "aiofiles",
    "multipart"
]
ignore_missing_imports = true

